namespace: diegocostadev\hotelbooking\tests
support_namespace: Support
actor_suffix: Tester
paths:
  tests: tests
  output: tests/_output
  data: tests/_data
  support: tests/_support
  envs: tests/_envs
bootstrap: _bootstrap.php
settings:
  colors: true
  memory_limit: 1024M
params:
  - env
modules:
  config:
    \craft\test\Craft:
      configFile: 'tests/_craft/config/test.php'
      entryUrl: 'https://hotel-booking.test/index.php'
      projectConfig: {}
      migrations: []
      plugins:
        - class: '\diegocostadev\hotelbooking\Plugin'
          handle: hotel-booking
      cleanup: true
      transaction: true
      dbSetup: {clean: true, setupCraft: true}
